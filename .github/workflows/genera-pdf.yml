name: Genera PDF

# Rigenera i PDF in pdf/ ogni volta che un documento Markdown cambia su main.
#
# Il ciclo infinito non si innesca per due motivi indipendenti:
#  1. il filtro paths reagisce solo ai .md alla radice, mentre il bot scrive in pdf/;
#  2. GitHub non fa ripartire i workflow sui push effettuati con GITHUB_TOKEN.

on:
  push:
    branches: [main]
    paths:
      - '*.md'
      - '.github/pdf-build/**'
      - '.github/workflows/genera-pdf.yml'
  workflow_dispatch:
    inputs:
      committa:
        description: 'Committare i PDF nel repository (togli la spunta per un collaudo a vuoto)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: genera-pdf
  cancel-in-progress: true

jobs:
  pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Preleva il repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Installa pandoc e XeLaTeX
        run: |
          sudo apt-get update -qq
          # Attenzione a --no-install-recommends: scarta i pacchetti che TeX Live
          # si limita a "raccomandare". Fra questi c'è lmodern, che il template
          # di pandoc carica sempre. Va quindi elencato esplicitamente, come ogni
          # altra dipendenza che qui diamo per scontata.
          sudo apt-get install -y --no-install-recommends \
            pandoc \
            texlive-xetex \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-italian \
            lmodern \
            fonts-texgyre

      # Se una compilazione fallisce, qui si vede subito se manca un pacchetto
      # o un font, senza dover leggere centinaia di righe di log LaTeX.
      - name: Diagnostica ambiente TeX
        run: |
          echo "### versioni"
          pandoc --version | head -1
          xelatex --version | head -1
          echo
          echo "### pacchetti LaTeX"
          for p in lmodern fancyhdr lastpage xcolor titlesec booktabs longtable \
                   array geometry hyperref polyglossia fontspec unicode-math iftex; do
            if percorso=$(kpsewhich "$p.sty" 2>/dev/null) && [ -n "$percorso" ]; then
              printf '%-14s %s\n' "$p" "$percorso"
            else
              printf '%-14s *** MANCANTE ***\n' "$p"
              echo "::warning::Pacchetto LaTeX non installato: $p.sty"
            fi
          done
          echo
          echo "### font TeX Gyre visti da fontconfig"
          if fc-list 2>/dev/null | grep -i "tex gyre" | head -5; then
            :
          else
            echo "nessuno"
            echo "::warning::fontconfig non vede alcun font TeX Gyre: si userà Latin Modern."
          fi

      - name: Genera i PDF
        run: bash .github/pdf-build/genera-pdf.sh

      # Scaricabili dalla pagina del run anche quando il commit non parte:
      # utile per controllare l'impaginazione prima di pubblicare.
      - name: Allega i PDF al run
        uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: pdf/
          if-no-files-found: error

      - name: Committa i PDF aggiornati
        if: github.event_name == 'push' || inputs.committa
        env:
          RAMO: ${{ github.ref_name }}
        run: |
          git config user.name  "RedFoxy Darrest"
          git config user.email "redfoxy@redfoxy.it"

          git add pdf/

          if git diff --cached --quiet; then
            echo "PDF invariati: nessun commit."
            exit 0
          fi

          git commit -m "Rigenerazione automatica dei PDF dai documenti Markdown"

          # Se nel frattempo è arrivato un altro push, riallinea e riprova.
          git push origin "HEAD:$RAMO" || {
            git pull --rebase origin "$RAMO"
            git push origin "HEAD:$RAMO"
          }
